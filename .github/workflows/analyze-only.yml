name: Analyze (fast branch gate)

# Lightweight gate for feature branches: no APK, no signing, ~2 minutes.
# The single release APK is built only by build-apk.yml on main/tags.

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/**'
  pull_request:
    branches:
      - 'main'
      - 'feat/**'
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
