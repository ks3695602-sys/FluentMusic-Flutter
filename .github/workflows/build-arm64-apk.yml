name: Build FluentMusic ARM64 APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build from and attach the APK to
        required: true
        default: v1.4.0
        type: string

permissions:
  contents: write

concurrency:
  group: arm64-apk-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-arm64-apk:
    name: Build smaller ARM64 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Accept Android SDK licenses and install platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-35" || true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch legacy Android plugins for CI
        run: |
          find /home/runner/.pub-cache/hosted/pub.dev -name "build.gradle" 2>/dev/null | while read -r f; do
            if grep -q "com.android.library" "$f" 2>/dev/null && ! grep -q "namespace" "$f" 2>/dev/null; then
              manifest="$(dirname "$f")/src/main/AndroidManifest.xml"
              if [ -f "$manifest" ]; then
                pkg_name=$(grep -o 'package="[^"]*"' "$manifest" | head -n 1 | cut -d'"' -f2)
                if [ -n "$pkg_name" ]; then
                  sed -i "/android {/a \\    namespace \"$pkg_name\"" "$f"
                fi
              fi
            fi
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$f"
            sed -i 's/JavaVersion.VERSION_1_7/JavaVersion.VERSION_17/g' "$f"
            sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" "$f"
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$f"
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' "$f"
          done
          find /home/runner/.pub-cache/hosted/pub.dev/on_audio_query_android* -name "build.gradle" 2>/dev/null | while read -r f; do
            if ! grep -q "namespace" "$f"; then
              sed -i '/android {/a \\    namespace "com.lucasjosino.on_audio_query"' "$f"
            fi
          done

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

      - name: Build ARM64-only release APK
        run: flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Prepare ARM64 APK
        run: |
          mkdir -p release_artifacts
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK" || { echo "ARM64 APK not found: $APK"; exit 1; }
          cp "$APK" release_artifacts/FluentMusic-arm64-release.apk
          ls -lh release_artifacts/FluentMusic-arm64-release.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluentMusic-ARM64-APK
          path: release_artifacts/FluentMusic-arm64-release.apk
          retention-days: 30

      - name: Attach ARM64 APK to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release_artifacts/FluentMusic-arm64-release.apk --clobber
