name: Build & Release FluentMusic Flutter

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build FluentMusic Flutter APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Accept Android SDK Licenses & Install Android Platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-35" || true
          # The NDK download occasionally arrives corrupted on hosted runners.
          # Retry up to three times, wiping the partial directory each time.
          for attempt in 1 2 3; do
            if sdkmanager "ndk;27.3.13750724"; then
              echo "NDK 27.3.13750724 installed"
              break
            fi
            echo "NDK install failed (attempt $attempt), cleaning up..."
            rm -rf "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/27.3.13750724"
            sleep 5
          done
          sdkmanager --list_installed | grep -i ndk || true

      - name: Install Linux Desktop Dependencies (for native assets in tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libx11-dev libxi-dev libxxf86vm-dev libxrandr-dev libxinerama-dev libxcursor-dev libxfixes-dev libxdamage-dev libxext-dev libxrender-dev libxtst-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libwayland-dev libxkbcommon-dev 2>/dev/null | tail -5

      - name: Install Dependencies
        run: flutter pub get

      - name: Auto-patch Legacy Plugin Namespaces for AGP 8+
        run: |
          echo "Scanning pub cache for Android library plugins without namespace..."
          find /home/runner/.pub-cache/hosted/pub.dev -name "build.gradle" 2>/dev/null | while read -r f; do
            if grep -q "com.android.library" "$f" 2>/dev/null && ! grep -q "namespace" "$f" 2>/dev/null; then
              manifest="$(dirname "$f")/src/main/AndroidManifest.xml"
              if [ -f "$manifest" ]; then
                pkg_name=$(grep -o 'package="[^"]*"' "$manifest" | head -n 1 | cut -d'"' -f2)
                if [ -n "$pkg_name" ]; then
                  echo "Patching namespace '$pkg_name' in $f"
                  sed -i "/android {/a \    namespace \"$pkg_name\"" "$f"
                fi
              fi
            fi
          done
          # Explicit check for on_audio_query_android
          find /home/runner/.pub-cache/hosted/pub.dev/on_audio_query_android* -name "build.gradle" 2>/dev/null | while read -r f; do
            if ! grep -q "namespace" "$f"; then
              echo "Explicitly patching on_audio_query_android: $f"
              sed -i '/android {/a \    namespace "com.lucasjosino.on_audio_query"' "$f"
            fi
          done

          # Patch JVM target compatibility and compileSdk across all pub.dev plugins for AGP 8+ and Kotlin 1.9+
          echo "Patching legacy JVM target compatibility to Java 17..."
          find /home/runner/.pub-cache/hosted/pub.dev -name "build.gradle" 2>/dev/null | while read -r f; do
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$f"
            sed -i 's/JavaVersion.VERSION_1_7/JavaVersion.VERSION_17/g' "$f"
            sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" "$f"
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$f"
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' "$f"
          done

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build Universal Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare APK Outputs
        run: |
          mkdir -p release_artifacts
          echo "Finding generated release APKs..."
          find build/app/outputs/flutter-apk -type f -name "*release*.apk"

          RELEASE_APK=$(find build/app/outputs/flutter-apk -type f -name "*release*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "Release APK was not generated"
            exit 1
          fi
          cp "$RELEASE_APK" release_artifacts/FluentMusic-universal-release.apk
          echo "Copied: $RELEASE_APK -> release_artifacts/FluentMusic-universal-release.apk"
          ls -la release_artifacts

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FluentMusic-Flutter-APKs
          path: release_artifacts/*.apk
          retention-days: 30

  build-windows:
    name: Build FluentMusic (Windows Desktop x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Desktop Release
        run: flutter build windows --release

      - name: Package Windows Release Archive
        shell: powershell
        run: |
          $targetPath = "build\windows\x64\runner\Release"
          if (-not (Test-Path $targetPath)) {
            Write-Error "Release output directory not found at $targetPath!"
            exit 1
          }
          Write-Host "Found Release bundle at: $targetPath"
          Get-ChildItem -Path $targetPath

          # Ship a friendly executable name; the bundle layout stays intact.
          if (Test-Path "$targetPath\musify.exe") {
            Move-Item "$targetPath\musify.exe" "$targetPath\FluentMusic.exe" -Force
            Write-Host "Renamed launcher to FluentMusic.exe"
          }
          if (-not (Test-Path "$targetPath\FluentMusic.exe")) {
            Write-Error "FluentMusic.exe missing from the release bundle!"
            exit 1
          }

          Compress-Archive -Path "$targetPath\*" -DestinationPath "FluentMusic-windows-x64.zip" -Force
          Write-Host "Compressed archive created: FluentMusic-windows-x64.zip"
          Get-Item FluentMusic-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluentMusic-windows-x64
          path: FluentMusic-windows-x64.zip
          retention-days: 30

  release:
    name: Publish Release Assets
    needs: [build-apk, build-windows]
    if: always() && needs.build-apk.result == 'success' && needs.build-windows.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Version From pubspec
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved FluentMusic version: $VERSION"

      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: FluentMusic-Flutter-APKs
          path: release_artifacts

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: FluentMusic-windows-x64
          path: release_artifacts

      - name: List Release Files
        run: ls -la release_artifacts

      - name: Remove Legacy Demo Asset
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset "v${{ steps.version.outputs.version }}" \
            FluentMusic-AppleMusicDemo-windows-x64.zip --yes || true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: "FluentMusic ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}"
          body: |
            FluentMusic v${{ steps.version.outputs.version }} — real Windows desktop build plus a fresh Android APK.

            ## Windows x64 (desktop app, not a demo)
            - Native Mica on Windows 11, Acrylic on Windows 10, solid fallback
            - Floating liquid-glass sidebar with macOS-style window controls
            - Full app: library, search, player, queue, downloads, settings
            - Install: download `FluentMusic-windows-x64.zip`, extract it anywhere, then run `FluentMusic.exe`
            - The build is not code-signed yet, so SmartScreen may warn — choose **More info → Run anyway**

            ## Android
            - `FluentMusic-universal-release.apk` — one universal build for all devices

            ## Updates
            - In-app update checks now come directly from GitHub Releases
            - Automatic daily check and manual check live in **Settings → Updates**
            - Announcements stay separate, so a stale `check.json` can never block updates

            See the full changelog at https://github.com/ks3695602-sys/FluentMusic-Flutter/releases
          files: release_artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
