name: Build & Release FluentMusic Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FluentMusic Flutter APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Auto-patch Legacy Plugin Namespaces for AGP 8+
        run: |
          echo "Scanning pub cache for Android library plugins without namespace..."
          find /home/runner/.pub-cache/hosted/pub.dev -name "build.gradle" 2>/dev/null | while read -r f; do
            if grep -q "com.android.library" "$f" 2>/dev/null && ! grep -q "namespace" "$f" 2>/dev/null; then
              manifest="$(dirname "$f")/src/main/AndroidManifest.xml"
              if [ -f "$manifest" ]; then
                pkg_name=$(grep -o 'package="[^"]*"' "$manifest" | head -n 1 | cut -d'"' -f2)
                if [ -n "$pkg_name" ]; then
                  echo "Patching namespace '$pkg_name' in $f"
                  sed -i "/android {/a \    namespace \"$pkg_name\"" "$f"
                fi
              fi
            fi
          done
          # Explicit check for on_audio_query_android
          find /home/runner/.pub-cache/hosted/pub.dev/on_audio_query_android* -name "build.gradle" 2>/dev/null | while read -r f; do
            if ! grep -q "namespace" "$f"; then
              echo "Explicitly patching on_audio_query_android: $f"
              sed -i '/android {/a \    namespace "com.lucasjosino.on_audio_query"' "$f"
            fi
          done

          # Patch JVM target compatibility across all pub.dev plugins for AGP 8+ and Kotlin 1.9+
          echo "Patching legacy JVM target compatibility to Java 17..."
          find /home/runner/.pub-cache/hosted/pub.dev -name "build.gradle" 2>/dev/null | while read -r f; do
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$f"
            sed -i 's/JavaVersion.VERSION_1_7/JavaVersion.VERSION_17/g' "$f"
            sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" "$f"
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$f"
          done

      - name: Build Universal Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Universal Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Prepare APK Outputs
        run: |
          mkdir -p release_artifacts
          echo "Finding all generated APKs..."
          find build/app/outputs/flutter-apk -type f -name "*.apk"

          # Copy release APK
          RELEASE_APK=$(find build/app/outputs/flutter-apk -type f -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" release_artifacts/FluentMusic-universal-release.apk
            echo "Copied: $RELEASE_APK -> release_artifacts/FluentMusic-universal-release.apk"
          fi

          # Copy debug APK
          DEBUG_APK=$(find build/app/outputs/flutter-apk -type f -name "*debug*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" release_artifacts/FluentMusic-universal-debug.apk
            echo "Copied: $DEBUG_APK -> release_artifacts/FluentMusic-universal-debug.apk"
          fi

          ls -la release_artifacts

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FluentMusic-Flutter-APKs
          path: release_artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "FluentMusic ${{ github.ref_name }}"
          files: release_artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
