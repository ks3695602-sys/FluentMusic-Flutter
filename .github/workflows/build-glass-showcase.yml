name: Build Liquid Glass Showcase APK

# Manual / path-triggered only. Does not affect the app release pipeline.
on:
  workflow_dispatch:
    inputs:
      package_ref:
        description: 'liquid_glass_widgets tag or ref to build'
        required: false
        default: 'v1.17.3'
  push:
    paths:
      - '.github/workflows/build-glass-showcase.yml'

permissions:
  contents: write

concurrency:
  group: glass-showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-showcase-apk:
    name: Build Liquid Glass Showcase (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout liquid_glass_widgets
        uses: actions/checkout@v4
        with:
          repository: sdegenaar/liquid_glass_widgets
          ref: ${{ inputs.package_ref || 'v1.17.3' }}
          path: pkg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android platform for example
        working-directory: pkg/example
        run: |
          flutter create \
            --platforms=android \
            --project-name liquid_glass_widgets_example \
            --org com.liquidglass \
            .

      - name: Install dependencies
        working-directory: pkg/example
        run: flutter pub get

      - name: Build release APK
        working-directory: pkg/example
        run: flutter build apk --release

      - name: Collect APK
        run: |
          REF="${{ inputs.package_ref || 'v1.17.3' }}"
          mkdir -p out
          cp pkg/example/build/app/outputs/flutter-apk/app-release.apk \
             "out/LiquidGlassShowcase-${REF}.apk"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-showcase-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: glass-showcase-${{ inputs.package_ref || 'v1.17.3' }}
          name: Liquid Glass Showcase ${{ inputs.package_ref || 'v1.17.3' }} (Android APK)
          body: |
            Android APK build of the official `liquid_glass_widgets` showcase
            (`example/`) at `${{ inputs.package_ref || 'v1.17.3' }}`.

            Built from upstream source: https://github.com/sdegenaar/liquid_glass_widgets
          files: out/*.apk
          prerelease: true
          fail_on_unmatched_files: true
