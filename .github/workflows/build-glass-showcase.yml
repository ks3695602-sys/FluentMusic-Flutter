name: Build Liquid Glass Showcase APK

# Manual / path-triggered only. Does not affect the app release pipeline.
on:
  workflow_dispatch:
    inputs:
      package_ref:
        description: 'liquid_glass_widgets tag or ref to build'
        required: false
        default: 'v1.17.3'
  push:
    paths:
      - '.github/workflows/build-glass-showcase.yml'

permissions:
  contents: write

concurrency:
  group: glass-showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-showcase-apk:
    name: Build Liquid Glass Showcase (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout liquid_glass_widgets
        uses: actions/checkout@v4
        with:
          repository: sdegenaar/liquid_glass_widgets
          ref: ${{ inputs.package_ref || 'v1.17.3' }}
          path: pkg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android platform for example
        working-directory: pkg/example
        run: |
          flutter create \
            --platforms=android \
            --project-name liquid_glass_widgets_example \
            --org com.liquidglass \
            .

      # The current Android lint version crashes while analysing some plugin
      # sources (JavaDocParser NoSuchMethodError in lintVitalAnalyzeRelease).
      # That is an AGP/lint bug, not a problem in this demo, so release lint is
      # turned off for this throwaway showcase build.
      - name: Disable release lint (AGP lint crash workaround)
        working-directory: pkg/example
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kts = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')

          if kts.exists():
              s = kts.read_text()
              if 'checkReleaseBuilds' not in s:
                  s = s.replace(
                      'android {',
                      'android {\n    lint {\n        checkReleaseBuilds = false\n'
                      '        abortOnError = false\n    }',
                      1,
                  )
                  kts.write_text(s)
              root = Path('android/build.gradle.kts')
              rs = root.read_text()
              if 'lintVital' not in rs:
                  rs += (
                      '\nsubprojects {\n'
                      '    tasks.configureEach {\n'
                      '        if (name.startsWith("lintVital")) enabled = false\n'
                      '    }\n'
                      '}\n'
                  )
                  root.write_text(rs)
          elif groovy.exists():
              s = groovy.read_text()
              if 'checkReleaseBuilds' not in s:
                  s = s.replace(
                      'android {',
                      'android {\n    lint {\n        checkReleaseBuilds false\n'
                      '        abortOnError false\n    }',
                      1,
                  )
                  groovy.write_text(s)
              root = Path('android/build.gradle')
              rs = root.read_text()
              if 'lintVital' not in rs:
                  rs += (
                      '\nsubprojects {\n'
                      '    tasks.configureEach { t ->\n'
                      '        if (t.name.startsWith("lintVital")) t.enabled = false\n'
                      '    }\n'
                      '}\n'
                  )
                  root.write_text(rs)
          else:
              raise SystemExit('No android build file found after flutter create')

          print('Release lint disabled')
          PY

      - name: Install dependencies
        working-directory: pkg/example
        run: flutter pub get

      - name: Build APK (release, debug fallback)
        working-directory: pkg/example
        run: |
          set +e
          flutter build apk --release
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::Release build failed (rc=$rc); falling back to debug APK"
            flutter build apk --debug
            drc=$?
            if [ $drc -ne 0 ]; then
              echo "::error::Both release and debug builds failed"
              exit $drc
            fi
            echo "BUILD_FLAVOR=debug" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "BUILD_FLAVOR=release" >> "$GITHUB_ENV"

      - name: Collect APK
        run: |
          REF="${{ inputs.package_ref || 'v1.17.3' }}"
          mkdir -p out
          SRC="pkg/example/build/app/outputs/flutter-apk/app-${BUILD_FLAVOR}.apk"
          cp "$SRC" "out/LiquidGlassShowcase-${REF}-${BUILD_FLAVOR}.apk"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-showcase-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: glass-showcase-${{ inputs.package_ref || 'v1.17.3' }}
          name: Liquid Glass Showcase ${{ inputs.package_ref || 'v1.17.3' }} (Android APK)
          body: |
            Android APK build of the official `liquid_glass_widgets` showcase
            (`example/`) at `${{ inputs.package_ref || 'v1.17.3' }}`.

            Built from upstream source: https://github.com/sdegenaar/liquid_glass_widgets
          files: out/*.apk
          prerelease: true
          fail_on_unmatched_files: true
