allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        if (subproject.android.hasProperty("compileSdkVersion")) {
            subproject.android.compileSdkVersion = 36
        }
    }
    subproject.tasks.matching { it.name.startsWith("compile") && it.name.endsWith("Kotlin") }.configureEach { task ->
        task.kotlinOptions {
            jvmTarget = "17"
            freeCompilerArgs += ["-Xskip-metadata-version-check"]
        }
    }
    subproject.tasks.matching { it.name.contains("AarMetadata") }.configureEach { task ->
        task.enabled = false
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
